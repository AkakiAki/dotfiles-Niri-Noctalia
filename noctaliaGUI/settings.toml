config_version = 16

[bar]
order = [ "default" ]

    [bar.default]
    capsule_thickness = 0.20999999903142452
    center = [ "workspaces", "notifications" ]
    compositor_blur = false
    concave_edge_corners = false
    end = [
        "tray",
        "wallpaper",
        "clipboard",
        "network",
        "bluetooth",
        "volume",
        "brightness",
        "battery",
        "control-center",
        "session"
    ]
    margin_edge = 1
    margin_ends = 5
    margin_opposite_edge = 1
    shadow = false
    start = [
        "launcher",
        "sysmon",
        "spacer_2",
        "clock",
        "date",
        "spacer_3",
        "media",
        "audio_visualizer",
        "spacer_3",
        "weather"
    ]

[desktop_widgets]
enabled = false
schema_version = 2
widget_order = []

    [desktop_widgets.grid]
    cell_size = 8
    major_interval = 4
    visible = true

    [desktop_widgets.widget]

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@eDP-1", "lockscreen-login-box@HDMI-A-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 960.0
    cy = 898.0
    output = "HDMI-A-1"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1".settings]
        background_color = "surface_container"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_password_reveal = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 768.0
    cy = 778.0
    output = "eDP-1"
    placement_height = 960.0
    placement_width = 1536.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_container"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_password_reveal = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[shell]
corner_radius_scale = 2.0
lang = "en"

    [shell.launcher]
    category_icons_only = true
    layout = "simple"

    [shell.panel]
    control_center_position = "center"
    open_near_click_control_center = true

[theme]
builtin = "Nord"
community_palette = "Oxocarbon"
mode = "dark"
source = "builtin"
wallpaper_scheme = "m3-content"

[wallpaper]
directory = "/home/akayls/Pictures/Wallpapers"

    [wallpaper.default]
    path = "/home/akayls/Pictures/Wallpapers/a_black_and_white_logo.png"

    [wallpaper.last]
    path = "/home/akayls/Pictures/Wallpapers/a_black_and_white_logo.png"

    [wallpaper.monitors.eDP-1]
    path = "/home/akayls/Pictures/Wallpapers/a_black_and_white_logo.png"

[widget.spacer_2]
type = "spacer"

[widget.spacer_3]
type = "spacer"